name: Deploy CodePortLab to  cPanel

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Latest Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js & Build Frontend Assets
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Build Assets (Vite / Filament)
        run: |
          npm ci
          npm run build

      - name: 4. FTP Sync Code to cPanel
        uses: SamKirkland/ftp-deploy-action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            .env
            storage/framework/cache/data/**
            storage/framework/sessions/**
            storage/framework/views/**
            storage/logs/**

      - name: 5. Trigger Remote Laravel Artisan Commands
        run: |
          curl -s "https://codeportlab.com/deploy.php?key=${{ secrets.DEPLOY_KEY }}"


