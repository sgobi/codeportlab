name: Deploy CodePortLab to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

# ஒரே நேரத்தில் இரண்டு deploy ஓடாமல் தடுக்கும்
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  web-deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Latest Code
        uses: actions/checkout@v4

      - name: 2. Setup PHP 8.1 (server பதிப்புடன் பொருந்த)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, intl, gd, zip, curl, pdo_mysql, fileinfo
          tools: composer:v2

      # composer scripts (package:discover, filament:upgrade) இயங்க தேவை.
      # CI-க்குள் மட்டுமே; கீழே exclude செய்வதால் server-க்குப் போகாது.
      - name: 3. Temporary .env for composer scripts
        run: cp .env.example .env

      - name: 4. Install PHP dependencies (vendor)
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      # package-lock.json இருந்தால் மட்டும் இயங்கும்
      - name: 5. Setup Node.js
        if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 6. Build frontend assets (Vite)
        if: hashFiles('package-lock.json') != ''
        run: |
          npm ci
          npm run build

      - name: 7. FTP Sync Code to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps                 # FTPS வேலை செய்யவில்லை என்றால் 'ftp'
          server-dir: ./                 # FTP கணக்கின் home = app root என்று உறுதி செய்யவும்
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .env
            .env.*
            node_modules/**
            tests/**
            storage/**
            bootstrap/cache/**

      - name: 8. Post-deploy hook (POST + header key)
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "X-Deploy-Key: ${{ secrets.DEPLOY_KEY }}" \
            https://codeportlab.com/deploy.php